apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: oficina
  labels:
    app: os-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: os-service
  template:
    metadata:
      labels:
        app: os-service
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "os-service"
        tags.datadoghq.com/version: "1.0.0"
    spec:
      containers:
        - name: os-service
          image: os-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: os-service-config
            - secretRef:
                name: os-service-secret
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 640Mi
---
apiVersion: v1
kind: Service
metadata:
  name: os-service
  namespace: oficina
spec:
  selector:
    app: os-service
  ports:
    - port: 8080
      targetPort: 8080
