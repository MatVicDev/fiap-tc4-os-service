apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  namespace: oficina
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://os-postgres:5432/os_db"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  # RabbitMQ compartilhado (namespace mensageria) — provisionado por fiap-tc3-infra-k8s;
  # no smoke test do CI vem de k8s/ci/rabbitmq.yaml.
  RABBITMQ_HOST: "rabbitmq.mensageria.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  SPRING_MAIL_HOST: "mailhog"
  SPRING_MAIL_PORT: "1025"
  JWT_EXPIRATION: "86400000"
  SAGA_PRAZO_APROVACAO: "P2D"
  SAGA_PRAZO_PAGAMENTO: "P1D"
  DD_SERVICE: "os-service"
  DD_ENV: "production"
  DD_VERSION: "1.0.0"
  DD_TRACE_SAMPLE_RATE: "1"
  DD_LOGS_INJECTION: "true"
