# Valores placeholder para uso local (kind/CI). No EKS o pipeline sobrescreve com os
# segredos reais (GitHub Secrets / AWS Secrets Manager) antes do rollout.
# JWT_SECRET precisa ser o MESMO nos três microsserviços e na Lambda de CPF.
apiVersion: v1
kind: Secret
metadata:
  name: os-service-secret
  namespace: oficina
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "os_user"
  SPRING_DATASOURCE_PASSWORD: "os_password"
  RABBITMQ_USERNAME: "oficina"
  RABBITMQ_PASSWORD: "oficina"
  JWT_SECRET: "troque-esta-chave-por-uma-secreta-de-pelo-menos-32-caracteres"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "troque-esta-senha-antes-de-usar-em-producao"
