# Sobe o os-service isolado com suas dependências (Postgres próprio, RabbitMQ, MailHog).
# Para o ambiente completo com os três microsserviços, veja docker-compose.full.yml.
services:
  os-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: os_db
      POSTGRES_USER: os_user
      POSTGRES_PASSWORD: os_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os_user -d os_db"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: oficina
      RABBITMQ_DEFAULT_PASS: oficina
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  os-service:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://os-postgres:5432/os_db
      SPRING_DATASOURCE_USERNAME: os_user
      SPRING_DATASOURCE_PASSWORD: os_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: oficina
      RABBITMQ_PASSWORD: oficina
      SPRING_MAIL_HOST: mailhog
      DD_TRACE_ENABLED: "false"
    depends_on:
      os-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
